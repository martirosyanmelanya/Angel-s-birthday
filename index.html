<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel's Birthday Invitation 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe0ec 0%, #fff5f7 50%, #ffd6e7 100%);
    font-family: 'Georgia', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Floating balloons */
  .balloon {
    position: absolute;
    width: 50px;
    height: 65px;
    border-radius: 50%;
    animation: floatUp 8s infinite ease-in;
    opacity: 0.8;
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -40px;
    left: 50%;
    width: 1px;
    height: 40px;
    background: #888;
  }
  .b1 { background: #ff4d6d; left: 10%; animation-delay: 0s; }
  .b2 { background: #ffffff; border: 2px solid #ff4d6d; left: 25%; animation-delay: 2s; }
  .b3 { background: #ff4d6d; left: 75%; animation-delay: 4s; }
  .b4 { background: #ffffff; border: 2px solid #ff4d6d; left: 85%; animation-delay: 6s; }

  @keyframes floatUp {
    0%   { transform: translateY(100vh); }
    100% { transform: translateY(-120vh); }
  }

  /* Gift Box */
  .scene {
    position: relative;
    width: 280px;
    height: 320px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .scene:hover { transform: scale(1.03); }

  .hint {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    color: #c9184a;
    font-style: italic;
    font-size: 1.1rem;
    animation: pulse 1.5s infinite;
    white-space: nowrap;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  /* The box body */
  .box {
    position: absolute;
    bottom: 0;
    width: 280px;
    height: 200px;
    background: linear-gradient(145deg, #ff4d6d, #c9184a);
    border-radius: 8px;
    box-shadow: 0 15px 30px rgba(201, 24, 74, 0.4);
    overflow: hidden;
  }
  /* White ribbon vertical */
  .box::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 100%;
    background: #ffffff;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
  }

  /* The lid */
  .lid {
    position: absolute;
    bottom: 200px;
    left: -10px;
    width: 300px;
    height: 50px;
    background: linear-gradient(145deg, #ff4d6d, #c9184a);
    border-radius: 6px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 1s cubic-bezier(.5,-0.3,.3,1.3);
    z-index: 5;
  }
  /* White ribbon horizontal on lid */
  .lid::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 100%;
    background: #ffffff;
  }

  /* The bow */
  .bow {
    position: absolute;
    bottom: 240px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 70px;
    transition: transform 1s cubic-bezier(.5,-0.3,.3,1.3);
    z-index: 6;
  }
  .bow-loop {
    position: absolute;
    top: 0;
    width: 60px;
    height: 60px;
    background: #ffffff;
    border: 3px solid #ff4d6d;
    border-radius: 50%;
    box-shadow: inset 0 0 10px rgba(255, 77, 109, 0.3);
  }
  .bow-loop.left  { left: 0;  transform: rotate(-25deg); }
  .bow-loop.right { right: 0; transform: rotate(25deg); }
  .bow-center {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 30px;
    background: #ff4d6d;
    border-radius: 50%;
    border: 3px solid #ffffff;
    z-index: 2;
  }
  .bow-tail {
    position: absolute;
    bottom: -20px;
    width: 25px;
    height: 40px;
    background: #ffffff;
    border: 2px solid #ff4d6d;
    border-radius: 0 0 50% 50%;
  }
  .bow-tail.left  { left: 35px; transform: rotate(-15deg); }
  .bow-tail.right { right: 35px; transform: rotate(15deg); }

  /* OPEN state */
  .scene.opened .lid {
    transform: translateY(-180px) rotate(-35deg);
  }
  .scene.opened .bow {
    transform: translate(-50%, -180px) rotate(-35deg);
  }
  .scene.opened .hint { display: none; }

  /* Invitation card */
  .card {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(250px);
    width: 240px;
    padding: 25px 20px;
    background: #fff;
    border: 3px solid #ff4d6d;
    border-radius: 15px;
    text-align: center;
    opacity: 0;
    transition: transform 1.2s cubic-bezier(.3,1.3,.3,1) 0.5s,
                opacity 0.6s ease 0.5s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    z-index: 4;
  }
  .scene.opened .card {
    transform: translateX(-50%) translateY(-280px);
    opacity: 1;
  }

  .card h1 {
    color: #c9184a;
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  .card .cake { font-size: 2.5rem; margin: 8px 0; }
  .card h2 {
    color: #ff4d6d;
    font-size: 1.8rem;
    margin: 10px 0;
    font-style: italic;
  }
  .card .date {
    background: #ffe0ec;
    color: #c9184a;
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
    display: inline-block;
    margin: 10px 0;
    letter-spacing: 2px;
  }
  .card p {
    color: #555;
    font-size: 0.95rem;
    margin-top: 10px;
    line-height: 1.5;
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0;
    pointer-events: none;
  }
  .scene.opened ~ .confetti-container .confetti {
    animation: fall 3s linear forwards;
  }
  .confetti-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <!-- Gift box -->
  <div class="scene" id="gift" onclick="openGift()">
    <div class="hint">✨ Click the gift to open ✨</div>

    <div class="bow">
      <div class="bow-loop left"></div>
      <div class="bow-loop right"></div>
      <div class="bow-tail left"></div>
      <div class="bow-tail right"></div>
      <div class="bow-center"></div>
    </div>

    <div class="lid"></div>
    <div class="box"></div>

    <div class="card">
      <div class="cake">🎂</div>
      <h1>You're Invited!</h1>
      <h2>Angel's Birthday</h2>
      <div class="date">11 · 11 · 2026</div>
      <p>Join us to celebrate a very special day!<br>
         Your presence is the best gift 🎁</p>
    </div>
  </div>

  <!-- Confetti container -->
  <div class="confetti-container" id="confettiBox"></div>

<script>
  function openGift() {
    const gift = document.getElementById('gift');
    if (gift.classList.contains('opened')) return;
    gift.classList.add('opened');
    launchConfetti();
  }

  function launchConfetti() {
    const box = document.getElementById('confettiBox');
    const colors = ['#ff4d6d', '#ffffff', '#ffd6e7', '#c9184a', '#ffb3c6'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = Math.random() * 2 + 's';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      c.style.width = c.style.height = (6 + Math.random() * 8) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 5000);
  }
</script>
</body>
</html>
